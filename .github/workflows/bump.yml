name: Bump rexmod

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    # Manual runs only from main: the job can push.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point the formula at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo alpcanaydin/rexmod --json tagName --jq .tagName)
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing unexpected tag: $tag" >&2
            exit 1
          fi
          url="https://github.com/alpcanaydin/rexmod/releases/download/$tag/rexmod-$tag-darwin-arm64.tar.gz"
          if grep -qF -- "\"$url\"" Formula/rexmod.rb; then
            echo "already at $tag"
            exit 0
          fi
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$' || { echo "bad checksum" >&2; exit 1; }
          # Rewrite the two fields from the environment; nothing is spliced into code.
          URL="$url" SHA="$sha" python3 - <<'PY'
          import os, re
          p = "Formula/rexmod.rb"
          s = open(p).read()
          s = re.sub(r'(?m)^  url ".*"$', lambda _: f'  url "{os.environ["URL"]}"', s, count=1)
          s = re.sub(r'(?m)^  sha256 ".*"$', lambda _: f'  sha256 "{os.environ["SHA"]}"', s, count=1)
          open(p, "w").write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "rexmod $tag"
          git push
